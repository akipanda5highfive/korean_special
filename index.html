const $=id=>document.getElementById(id);
const KEY='specialKoreanWords_v2';
let legacy=JSON.parse(localStorage.getItem('specialKoreanWords_v1')||'null');
let state=JSON.parse(localStorage.getItem(KEY)||'null');
if(!state){
  state={attempts:legacy?.attempts||0,correct:legacy?.correct||0,wrong:[],favorites:[]};
  if(legacy){state.wrong=(legacy.wrong||[]).map(n=>'w:'+n);state.favorites=(legacy.favorites||[]).map(n=>'w:'+n)}
}
let category='words',session=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state));stats()}
function stats(){$('attempts').textContent=state.attempts;$('correct').textContent=state.correct;$('rate').textContent=state.attempts?Math.round(state.correct/state.attempts*100)+'%':'0%';$('favCount').textContent=state.favorites.length}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(a,n){return shuffle(a).slice(0,n)}
function normalize(s){return String(s).trim().replace(/[\s・,，、。]/g,'').toLowerCase()}
function variants(s){return String(s).split(/[、,，]/).map(normalize).filter(Boolean)}
function dataset(){
  if(category==='words') return WORDS;
  let g=$('grade').value;return g==='all'?HANJA:HANJA.filter(x=>String(x.grade)===g)
}
function pool(){let p=dataset();if($('range').value==='wrong')p=p.filter(w=>state.wrong.includes(w.id));if($('range').value==='favorite')p=p.filter(w=>state.favorites.includes(w.id));return p}
function updateUI(){
  let isH=category==='hanja';$('gradeWrap').classList.toggle('hidden',!isH);
  $('direction').innerHTML=isH?'<option value="kanji-ko">漢字 → ハングル</option><option value="ko-kanji">ハングル → 漢字</option><option value="mix">ランダムに混ぜる</option>':'<option value="ko-ja">韓国語 → 日本語</option><option value="ja-ko">日本語 → 韓国語</option><option value="mix">ランダムに混ぜる</option>';
  $('categoryNote').innerHTML=isH?`<b>現在：</b>漢字→ハングル ${dataset().length}字（10級～5級）。級ごとにも選べます。複数の読みは、どれを入力しても正解です。`:`<b>現在：</b>もともとの漢字語 ${WORDS.length}語。答え合わせでは対応する漢字も表示します。`;
  $('count').max=dataset().length;
}
function start(forced){let p=forced||pool();if(!p.length){alert('この範囲には問題がありません。');return}let n=Math.max(1,Math.min(Number($('count').value)||20,p.length));let q=$('randomize').checked?pick(p,n):p.slice(0,n);session={queue:q,index:0,score:0,wrong:[],answered:false,mode:'',dir:'',category};$('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');show()}
function current(){return session.queue[session.index]}
function qa(w){
 let d=$('direction').value;if(d==='mix') d=Math.random()<.5?(category==='hanja'?'kanji-ko':'ko-ja'):(category==='hanja'?'ko-kanji':'ja-ko');
 if(category==='hanja') return d==='kanji-ko'?{dir:d,q:w.kanji,a:w.ko,prompt:'ハングルの読みは？',display:`${w.kanji} ＝ ${w.ko}（${w.grade}級）`}:{dir:d,q:w.ko,a:w.kanji,prompt:'漢字は？',display:`${w.ko} ＝ ${w.kanji}（${w.grade}級）`};
 return d==='ko-ja'?{dir:d,q:w.ko,a:w.ja,prompt:'日本語の意味は？',display:`${w.ko} ＝ ${w.ja}　【${w.hanja}】`}:{dir:d,q:w.ja,a:w.ko,prompt:'韓国語では？',display:`${w.ko} ＝ ${w.ja}　【${w.hanja}】`};
}
function show(){let w=current();session.answered=false;session.qa=qa(w);session.mode=$('mode').value==='mix'?(Math.random()<.5?'choice':'input'):$('mode').value;$('progress').textContent=`${session.index+1} / ${session.queue.length}`;$('question').textContent=session.qa.q;$('question').style.fontSize=(session.qa.q.length<=2)?'clamp(3rem,14vw,5.6rem)':'clamp(1.8rem,7vw,3rem)';$('prompt').textContent=session.qa.prompt;$('hanjaHint').textContent='';$('feedback').innerHTML='';$('beforeActions').classList.remove('hidden');$('afterActions').classList.add('hidden');showFav();$('answerInput').value='';$('answerInput').classList.toggle('korean-input',/ko$/.test(session.qa.dir)||session.qa.dir==='ja-ko');if(session.mode==='choice')showChoices();else{$('choices').innerHTML='';$('inputArea').classList.remove('hidden');setTimeout(()=>$('answerInput').focus(),100)}}
function answerOptions(w){if(category==='hanja')return session.qa.dir==='kanji-ko'?w.ko:w.kanji;return session.qa.dir==='ko-ja'?w.ja:w.ko}
function showChoices(){$('inputArea').classList.add('hidden');let w=current(),correct=session.qa.a;let source=(category==='hanja'?HANJA:WORDS).filter(x=>x.id!==w.id);let others=[];for(let x of shuffle(source)){let v=answerOptions(x);if(v!==correct&&!others.includes(v))others.push(v);if(others.length===3)break}$('choices').innerHTML=shuffle([correct,...others]).map(x=>`<button class="choice">${x}</button>`).join('');[...$('choices').children].forEach(b=>b.onclick=()=>answer(b.textContent,b))}
function isCorrect(value,correct){let v=normalize(value);if(category==='hanja'&&session.qa.dir==='kanji-ko')return variants(correct).includes(v);if(category==='words'&&session.qa.dir==='ko-ja')return String(correct).split('・').some(x=>normalize(x)===v)||normalize(correct)===v;return normalize(correct)===v}
function answer(value,btn){if(session.answered)return;session.answered=true;let w=current(),correctAnswer=session.qa.a,ok=isCorrect(value,correctAnswer);state.attempts++;if(ok){state.correct++;session.score++}else{if(!session.wrong.includes(w.id))session.wrong.push(w.id);if(!state.wrong.includes(w.id))state.wrong.push(w.id)}if(btn){[...$('choices').children].forEach(b=>{if(normalize(b.textContent)===normalize(correctAnswer))b.classList.add('correct')});if(!ok)btn.classList.add('wrong')}$('feedback').innerHTML=`<div class="${ok?'good':'bad'}">${ok?'○ 正解！':'× 正解は '+correctAnswer}<br><span style="font-size:.92rem">${session.qa.display}</span></div>`;$('hanjaHint').textContent=category==='hanja'?`${w.grade}級`:(w.hanja.startsWith('固有語')?w.hanja:`漢字：${w.hanja}`);$('beforeActions').classList.add('hidden');$('afterActions').classList.remove('hidden');save()}
function dontKnow(){answer('___')}function next(){if(!session.answered)return;if(++session.index>=session.queue.length)finish();else show()}
function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('resultBig').textContent=`${session.score} / ${session.queue.length}`;$('resultText').textContent=`正答率 ${Math.round(session.score/session.queue.length*100)}%　間違い ${session.wrong.length}問`;$('retryBtn').disabled=!session.wrong.length}
function back(){$('result').classList.add('hidden');$('setup').classList.remove('hidden')}
function toggleFav(){let id=current().id,i=state.favorites.indexOf(id);if(i>=0)state.favorites.splice(i,1);else state.favorites.push(id);save();showFav()}
function showFav(){let on=state.favorites.includes(current().id);$('favoriteBtn').textContent=on?'★':'☆';$('favoriteBtn').classList.toggle('on',on)}
function markWrong(){let id=current().id;if(!session.wrong.includes(id))session.wrong.push(id);if(!state.wrong.includes(id))state.wrong.push(id);$('markWrongBtn').textContent='復習対象にしました';save()}
function speak(){let w=current(),text=category==='hanja'?variants(w.ko)[0]:w.ko;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.85;speechSynthesis.speak(u)}
$('startBtn').onclick=()=>start();$('dontKnowBtn').onclick=dontKnow;$('submitBtn').onclick=()=>answer($('answerInput').value);$('answerInput').onkeydown=e=>{if(e.key==='Enter'){session.answered?next():answer(e.target.value)}};$('nextBtn').onclick=next;$('favoriteBtn').onclick=toggleFav;$('markWrongBtn').onclick=markWrong;$('speakBtn').onclick=speak;$('stopBtn').onclick=()=>{if(confirm('テストを終了しますか？'))finish()};$('backBtn').onclick=back;$('retryBtn').onclick=()=>{let all=session.category==='hanja'?HANJA:WORDS;start(all.filter(w=>session.wrong.includes(w.id)))};$('resetBtn').onclick=()=>{if(confirm('学習記録をすべて消しますか？')){state={attempts:0,correct:0,wrong:[],favorites:[]};save()}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(b.classList.contains('locked')){alert('このカテゴリは、あとから単語を追加できます。');return}category=b.dataset.cat;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));updateUI()});
$('grade').onchange=updateUI;updateUI();stats();
</script></main></body></html>
